name: OPL Native diagnostic
on: [workflow_dispatch, push]
jobs:
  build:
    runs-on: ubuntu-latest
    container: ps2dev/ps2dev:latest
    steps:
      - uses: actions/checkout@v4
      - run: apk add --no-cache make binutils
      - run: make -C opl_native -B
      - run: strings opl_native/MOVTEST.ELF | grep -F "DG MOVIE V0.1.6"
      - uses: actions/upload-artifact@v4
        with:
          name: MOVIE-OPL-V016-DIAGNOSTICO
          path: |
            opl_native/MOVTEST.ELF
            opl_native/SYSTEM.CNF
          if-no-files-found: error
