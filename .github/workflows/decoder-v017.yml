name: V017 XVID Decoder Probe

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/decoder-v017.yml'

jobs:
  decoder:
    runs-on: ubuntu-latest
    container: ps2dev/ps2dev:latest

    steps:
      - uses: actions/checkout@v4

      - name: Prepare isolated sources
        run: |
          mkdir -p decoder_test

          cat > decoder_test/ctype_compat.h <<'EOF'
          #ifndef DG_CTYPE_COMPAT_H
          #define DG_CTYPE_COMPAT_H
          #include <ctype.h>
          #undef isalnum
          #undef isalpha
          #undef isblank
          #undef iscntrl
          #undef isdigit
          #undef isgraph
          #undef islower
          #undef isprint
          #undef ispunct
          #undef isspace
          #undef isupper
          #undef isxdigit
          #undef toupper
          #undef tolower
          #undef _U
          #endif
          EOF

          sed \
            -e '/#include "SMS_MSMPEG4.h"/d' \
            -e '/#include "SMS_MPEG12.h"/d' \
            -e '/#include "SMS_MP123.h"/d' \
            -e '/#include "SMS_AC3.h"/d' \
            -e '/#include "SMS_DTS.h"/d' \
            -e '/#include "SMS_OGG.h"/d' \
            -e '/#include "SMS_WMA.h"/d' \
            -e '/#include "SMS_PCM.h"/d' \
            -e '/#include "SMS_AAC.h"/d' \
            -e '/#include "SMS_FLAC.h"/d' \
            -e '/^int SMS_CodecOpen (/,/^}  \/\* end SMS_CodecOpen \*\//c\
          int SMS_CodecOpen ( SMS_CodecContext* apCtx ) {\
            if (apCtx->m_ID != SMS_CodecID_MPEG4) return 0;\
            SMS_Codec_MPEG4_Open(apCtx);\
            return apCtx->m_pCodec != 0;\
          }' src/SMS_Codec.c > decoder_test/SMS_Codec_XVID.c

          sed \
            -e 's/fio_dirent_t/io_dirent_t/g' \
            -e '/^void SMS_EEScanDir (/,/^}  \/\* end SMS_EEScanDir \*\//d' \
            src/SMS_EE.c > decoder_test/SMS_EE_XVID.c

      - name: Compile XVID modules
        run: |
          FAILED=0
          touch decoder_test/build.log
          touch decoder_test/status.txt

          for module in \
            SMS_MPEG4.c \
            SMS_MPEG.c \
            SMS_H263.c \
            SMS_VLC.c \
            SMS_DSP.c \
            SMS_DSP_MMI.S \
            SMS_DSP_QPel.S \
            SMS_VideoBuffer.c \
            SMS_RingBuffer.c \
            SMS_IPU.c \
            SMS_IPU_0.s \
            SMS_IPU_1.c \
            SMS_DMA_0.s \
            SMS_DXSB.c \
            SMS_Data.c \
            SMS_MPEGInit.c \
            SMS_VSync.c \
            SMS_Utils.S \
            SMS_Timer.s \
            SMS_GS_0.S \
            SMS_EE.c \
            SMS_Codec.c
          do
            SOURCE="src/$module"
            EXTRA=""

            case "$module" in
              *.c)
                EXTRA="-include decoder_test/ctype_compat.h"
                ;;
            esac

            case "$module" in
              SMS_Codec.c)
                SOURCE=decoder_test/SMS_Codec_XVID.c
                ;;
              SMS_EE.c)
                SOURCE=decoder_test/SMS_EE_XVID.c
                EXTRA="-include decoder_test/ctype_compat.h -DNEWLIB_PORT_AWARE"
                ;;
            esac

            echo "COMPILANDO $module" >> decoder_test/build.log

            if mips64r5900el-ps2-elf-gcc \
              -D_EE -O2 -G0 \
              -fno-common \
              -ffunction-sections \
              -fdata-sections \
              $EXTRA \
              -Iinclude \
              -Isrc \
              -I"$PS2SDK/ee/include" \
              -I"$PS2SDK/common/include" \
              -I"$PS2SDK/ports/include" \
              -c "$SOURCE" \
              -o "decoder_test/${module%.*}.o" \
              >> decoder_test/build.log 2>&1
            then
              echo "OK $module" >> decoder_test/status.txt
            else
              echo "FALHA $module" >> decoder_test/status.txt
              FAILED=1
            fi
          done

          cat decoder_test/build.log
          cat decoder_test/status.txt

          exit "$FAILED"

      - name: Create link probe
        run: |
          cat > decoder_test/probe.c <<'EOF'
          #include <tamtypes.h>
          #include <debug.h>
          #include "SMS_MPEG4.h"

          static void (* volatile decoder_entry)
            (SMS_CodecContext*) = SMS_Codec_MPEG4_Open;

          int main(void)
          {
              init_scr();

              scr_printf("DG MOVIE V0.1.7J\n");
              scr_printf("XVID LINK PROBE\n");

              if (decoder_entry != 0)
                  scr_printf("DECODER SYMBOL OK\n");

              scr_printf("SEM DECODIFICACAO\n");

              for (;;) {
                  __asm__ volatile("nop");
              }

              return 0;
          }
          EOF

          mips64r5900el-ps2-elf-gcc \
            -D_EE -O2 -G0 \
            -ffunction-sections \
            -fdata-sections \
            -Iinclude \
            -I"$PS2SDK/ee/include" \
            -I"$PS2SDK/common/include" \
            -c decoder_test/probe.c \
            -o decoder_test/probe.o

      - name: Real ELF link test
        run: |
          cd decoder_test

          cat > Makefile <<'EOF'
          EE_BIN = XVIDPROBE.ELF
          EE_OBJS = probe.o SMS_MPEG4.o SMS_MPEG.o SMS_H263.o SMS_VLC.o SMS_DSP.o SMS_DSP_MMI.o SMS_DSP_QPel.o SMS_VideoBuffer.o SMS_RingBuffer.o SMS_IPU.o SMS_IPU_0.o SMS_IPU_1.o SMS_DMA_0.o SMS_DXSB.o SMS_Data.o SMS_MPEGInit.o SMS_VSync.o SMS_Utils.o SMS_Timer.o SMS_GS_0.o SMS_EE.o SMS_Codec.o
          EE_LIBS = -ldebug -lcdvd -lm
          EE_CFLAGS = -O2 -G0
          EE_LDFLAGS += -Wl,--gc-sections -Wl,-Map=elf_link_map.txt -Wl,--print-gc-sections
          all: $(EE_BIN)
          include $(PS2SDK)/samples/Makefile.pref
          include $(PS2SDK)/samples/Makefile.eeglobal
          EOF

          RESULT=0
          make > elf_link.log 2>&1 || RESULT=$?

          cat elf_link.log

          grep -E 'undefined reference|error:' \
            elf_link.log > unresolved.txt || true

          if [ -f XVIDPROBE.ELF ]; then
            mips64r5900el-ps2-elf-nm \
              XVIDPROBE.ELF > elf_symbols.txt

            mips64r5900el-ps2-elf-nm \
              -u XVIDPROBE.ELF > elf_undefined.txt

            echo "ELF GERADO" > elf_status.txt
          else
            echo "ELF NAO GERADO" > elf_status.txt
          fi

          cat elf_status.txt
          cat unresolved.txt

          exit "$RESULT"

      - name: Export diagnostics
        if: always()
        run: |
          mkdir -p decoder_test/diagnostics

          for obj in decoder_test/*.o
          do
            NAME=$(basename "$obj" .o)

            mips64r5900el-ps2-elf-nm -u "$obj" \
              > "decoder_test/diagnostics/${NAME}_undefined.txt"
          done

          mips64r5900el-ps2-elf-gcc --version \
            > decoder_test/compiler_version.txt

          mkdir -p decoder_test/source
          cp -r src decoder_test/source/
          cp -r include decoder_test/source/
          cp -r opl_native decoder_test/source/

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: V017J-XVID-ELF-PROBE
          path: decoder_test/
