name: V017K2A XVID Context Open

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/decoder-v017.yml'

jobs:
  decoder:
    runs-on: ubuntu-latest
    container: ps2dev/ps2dev:latest

    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: apk add --no-cache make

      - name: Prepare isolated sources
        run: |
          mkdir -p decoder_test

          cat > decoder_test/ctype_compat.h <<'EOF'
          #ifndef DG_CTYPE_COMPAT_H
          #define DG_CTYPE_COMPAT_H
          #include <ctype.h>
          #undef isalnum
          #undef isalpha
          #undef isblank
          #undef iscntrl
          #undef isdigit
          #undef isgraph
          #undef islower
          #undef isprint
          #undef ispunct
          #undef isspace
          #undef isupper
          #undef isxdigit
          #undef toupper
          #undef tolower
          #undef _U
          #endif
          EOF

          sed \
            -e '/#include "SMS_MSMPEG4.h"/d' \
            -e '/#include "SMS_MPEG12.h"/d' \
            -e '/#include "SMS_MP123.h"/d' \
            -e '/#include "SMS_AC3.h"/d' \
            -e '/#include "SMS_DTS.h"/d' \
            -e '/#include "SMS_OGG.h"/d' \
            -e '/#include "SMS_WMA.h"/d' \
            -e '/#include "SMS_PCM.h"/d' \
            -e '/#include "SMS_AAC.h"/d' \
            -e '/#include "SMS_FLAC.h"/d' \
            -e '/^int SMS_CodecOpen (/,/^}  \/\* end SMS_CodecOpen \*\//c\
          int SMS_CodecOpen ( SMS_CodecContext* apCtx ) {\
            if (apCtx->m_ID != SMS_CodecID_MPEG4) return 0;\
            SMS_Codec_MPEG4_Open(apCtx);\
            return apCtx->m_pCodec != 0;\
          }' src/SMS_Codec.c > decoder_test/SMS_Codec_XVID.c

          sed \
            -e 's/fio_dirent_t/io_dirent_t/g' \
            -e '/^void SMS_EEScanDir (/,/^}  \/\* end SMS_EEScanDir \*\//d' \
            src/SMS_EE.c > decoder_test/SMS_EE_XVID.c

      - name: Compile XVID modules
        run: |
          FAILED=0

          touch decoder_test/build.log
          touch decoder_test/status.txt

          for module in \
            SMS_MPEG4.c \
            SMS_MPEG.c \
            SMS_H263.c \
            SMS_VLC.c \
            SMS_DSP.c \
            SMS_DSP_MMI.S \
            SMS_DSP_QPel.S \
            SMS_VideoBuffer.c \
            SMS_RingBuffer.c \
            SMS_IPU.c \
            SMS_IPU_0.s \
            SMS_IPU_1.c \
            SMS_DMA_0.s \
            SMS_DXSB.c \
            SMS_Data.c \
            SMS_MPEGInit.c \
            SMS_VSync.c \
            SMS_Utils.S \
            SMS_Timer.s \
            SMS_GS_0.S \
            SMS_EE.c \
            SMS_Codec.c
          do
            SOURCE="src/$module"
            EXTRA=""

            case "$module" in
              *.c)
                EXTRA="-include decoder_test/ctype_compat.h"
                ;;
            esac

            case "$module" in
              SMS_Codec.c)
                SOURCE=decoder_test/SMS_Codec_XVID.c
                ;;
              SMS_EE.c)
                SOURCE=decoder_test/SMS_EE_XVID.c
                EXTRA="-include decoder_test/ctype_compat.h -DNEWLIB_PORT_AWARE"
                ;;
            esac

            echo "COMPILANDO $module" >> decoder_test/build.log

            if mips64r5900el-ps2-elf-gcc \
              -D_EE -O2 -G0 \
              -fno-common \
              -ffunction-sections \
              -fdata-sections \
              $EXTRA \
              -Iinclude \
              -Isrc \
              -I"$PS2SDK/ee/include" \
              -I"$PS2SDK/common/include" \
              -I"$PS2SDK/ports/include" \
              -c "$SOURCE" \
              -o "decoder_test/${module%.*}.o" \
              >> decoder_test/build.log 2>&1
            then
              echo "OK $module" >> decoder_test/status.txt
            else
              echo "FALHA $module" >> decoder_test/status.txt
              FAILED=1
            fi
          done

          cat decoder_test/build.log
          cat decoder_test/status.txt

          exit "$FAILED"

      - name: Fix SMS timer symbol conflict
        run: |
          for obj in decoder_test/SMS_*.o
          do
            mips64r5900el-ps2-elf-objcopy \
              --redefine-sym g_Timer=DG_SMS_Timer \
              "$obj"
          done

          mips64r5900el-ps2-elf-nm \
            decoder_test/SMS_*.o \
            > decoder_test/timer_fix_symbols.txt

      - name: Prepare native K2A
        run: |
          mkdir -p native_k2a

          cp -r opl_native/. native_k2a/
          cp decoder_test/SMS_*.o native_k2a/

          sed -i 's/V0\.1\.6/V0.1.7K2A/g' native_k2a/main.c

          cat > native_k2a/xvid_probe.h <<'EOF'
          #ifndef DG_XVID_PROBE_H
          #define DG_XVID_PROBE_H

          int dg_xvid_open(
              unsigned width,
              unsigned height,
              unsigned rate,
              unsigned scale,
              unsigned tag
          );

          #endif
          EOF

          cat > native_k2a/xvid_probe.c <<'EOF'
          #include <stdlib.h>
          #include <string.h>
          #include <debug.h>
          #include "SMS_MPEG4.h"
          #include "xvid_probe.h"

          static SMS_CodecContext ctx;

          int dg_xvid_open(
              unsigned width,
              unsigned height,
              unsigned rate,
              unsigned scale,
              unsigned tag
          )
          {
              scr_printf("K2A: CONTEXTO\n");

              if (!width || !height || !rate || !scale) {
                  scr_printf("PARAMETROS INVALIDOS\n");
                  return 0;
              }

              if (width > 640 || height > 480) {
                  scr_printf("RESOLUCAO INVALIDA\n");
                  return 0;
              }

              memset(&ctx, 0, sizeof(ctx));

              ctx.m_ID = SMS_CodecID_MPEG4;
              ctx.m_Type = SMS_CodecTypeVideo;
              ctx.m_Tag = tag;
              ctx.m_Width = width;
              ctx.m_Height = height;
              ctx.m_FrameRate = rate;
              ctx.m_FrameRateBase = scale;
              ctx.m_Flags = SMS_CODEC_FLAG_LOW_DELAY;

              scr_printf("CONTEXTO OK\n");
              scr_printf("ANTES MPEG4 OPEN\n");

              SMS_Codec_MPEG4_Open(&ctx);

              scr_printf("DEPOIS MPEG4 OPEN\n");

              if (!ctx.m_pCodec) {
                  scr_printf("CODEC NULL\n");
                  return 0;
              }

              scr_printf("CODEC OK\n");

              if (!ctx.m_pCodec->m_pName ||
                  !ctx.m_pCodec->Init ||
                  !ctx.m_pCodec->Decode ||
                  !ctx.m_pCodec->Destroy) {

                  scr_printf("PONTEIROS INVALIDOS\n");
                  return 0;
              }

              scr_printf("INIT OK\n");
              scr_printf("DECODE OK\n");
              scr_printf("DESTROY OK\n");
              scr_printf("XVID OPEN SUCESSO\n");

              return 1;
          }
          EOF

          sed -i '1i#include "xvid_probe.h"' \
            native_k2a/main.c

          grep -q 'scr_printf("SEM DECODIFICACAO' \
            native_k2a/main.c

          sed -i '/scr_printf("SEM DECODIFICACAO/i\
                    if (ok \&\& vol \&\& vop) {\
                        dg_xvid_open(a.width, a.height,\
                            a.rate, a.scale, a.codec);\
                    }' native_k2a/main.c

          grep -n -A8 -B8 'dg_xvid_open(' \
            native_k2a/main.c

          cat > native_k2a/Makefile <<'EOF'
          EE_BIN = MOVTEST.ELF
          EE_OBJS = main.o iso.o avi.o xvid_probe.o SMS_MPEG4.o SMS_MPEG.o SMS_H263.o SMS_VLC.o SMS_DSP.o SMS_DSP_MMI.o SMS_DSP_QPel.o SMS_VideoBuffer.o SMS_RingBuffer.o SMS_IPU.o SMS_IPU_0.o SMS_IPU_1.o SMS_DMA_0.o SMS_DXSB.o SMS_Data.o SMS_MPEGInit.o SMS_VSync.o SMS_Utils.o SMS_Timer.o SMS_GS_0.o SMS_EE.o SMS_Codec.o
          EE_LIBS = -ldebug -lcdvd -lm
          EE_INCS = -I../include -I../src
          EE_CFLAGS = -O2 -G0
          EE_LDFLAGS += -Wl,--gc-sections -Wl,--undefined=SMS_Codec_MPEG4_Open -Wl,-Map=link_map.txt
          all: $(EE_BIN)
          include $(PS2SDK)/samples/Makefile.pref
          include $(PS2SDK)/samples/Makefile.eeglobal
          EOF

      - name: Build native K2A
        run: |
          mkdir -p output/TESTE_K2A
          mkdir -p output/diagnostics

          rm -f native_k2a/MOVTEST.ELF
          rm -f native_k2a/main.o
          rm -f native_k2a/iso.o
          rm -f native_k2a/avi.o
          rm -f native_k2a/xvid_probe.o

          RESULT=0

          make -C native_k2a \
            > output/diagnostics/build_k2a.txt 2>&1 \
            || RESULT=$?

          cat output/diagnostics/build_k2a.txt

          if [ "$RESULT" -eq 0 ] && \
             [ -s native_k2a/MOVTEST.ELF ]; then

            mips64r5900el-ps2-elf-nm \
              native_k2a/MOVTEST.ELF \
              > output/diagnostics/symbols.txt

            mips64r5900el-ps2-elf-nm \
              -u native_k2a/MOVTEST.ELF \
              > output/diagnostics/undefined.txt

            grep -E ' [Tt] SMS_Codec_MPEG4_Open$' \
              output/diagnostics/symbols.txt

            grep -E ' [Tt] dg_xvid_open$' \
              output/diagnostics/symbols.txt

            cp native_k2a/MOVTEST.ELF output/TESTE_K2A/
            cp native_k2a/SYSTEM.CNF output/TESTE_K2A/

            echo "K2A ELF GERADO COM SUCESSO" \
              > output/diagnostics/elf_status.txt
          else
            echo "K2A ELF NAO GERADO" \
              > output/diagnostics/elf_status.txt

            if [ "$RESULT" -eq 0 ]; then
              RESULT=1
            fi
          fi

          cat output/diagnostics/elf_status.txt

          exit "$RESULT"

      - name: Export diagnostics
        if: always()
        run: |
          mkdir -p output/diagnostics
          mkdir -p output/source

          cp decoder_test/*.txt output/diagnostics/ || true
          cp decoder_test/*.log output/diagnostics/ || true

          cp -r opl_native output/source/

          if [ -d native_k2a ]; then
            cp native_k2a/*.c output/source/
            cp native_k2a/*.h output/source/
            cp native_k2a/Makefile output/source/Makefile_K2A

            if [ -f native_k2a/link_map.txt ]; then
              cp native_k2a/link_map.txt output/diagnostics/
            fi
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: V017K2A-XVID-CONTEXT
          path: output/
