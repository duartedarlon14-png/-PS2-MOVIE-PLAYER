name: V017 XVID Decoder Probe

on: [workflow_dispatch, push]

jobs:
  decoder:
    runs-on: ubuntu-latest
    container: ps2dev/ps2dev:latest

    steps:
      - uses: actions/checkout@v4

      - name: Compile isolated XVID decoder
        run: |
          mkdir -p decoder_test
          FAILED=0

          for module in \
            SMS_MPEG4.c \
            SMS_MPEG.c \
            SMS_H263.c \
            SMS_VLC.c \
            SMS_DSP.c \
            SMS_DSP_MMI.S \
            SMS_DSP_QPel.S \
            SMS_VideoBuffer.c \
            SMS_RingBuffer.c \
            SMS_Codec.c \
            SMS_IPU.c \
            SMS_IPU_0.s \
            SMS_IPU_1.c \
            SMS_DMA_0.s \
            SMS_DXSB.c \
            SMS_Data.c \
            SMS_MPEGInit.c \
            SMS_VSync.c \
            SMS_Utils.S \
            SMS_Timer.s \
            SMS_GS_0.S
          do
            echo "COMPILANDO $module"

            if mips64r5900el-ps2-elf-gcc \
              -D_EE -O2 -G0 \
              -fno-common \
              -ffunction-sections \
              -fdata-sections \
              -Iinclude \
              -I"$PS2SDK/ee/include" \
              -I"$PS2SDK/common/include" \
              -I"$PS2SDK/ports/include" \
              -c "src/$module" \
              -o "decoder_test/${module%.*}.o"
            then
              echo "OK $module" >> decoder_test/status.txt
            else
              echo "FALHA $module" >> decoder_test/status.txt
              FAILED=1
            fi
          done

          cat decoder_test/status.txt
          exit "$FAILED"

      - name: Isolate MPEG4 entry point
        if: always()
        run: |
          mips64r5900el-ps2-elf-ld \
            -r \
            --gc-sections \
            -u SMS_Codec_MPEG4_Open \
            decoder_test/*.o \
            -o decoder_test/xvid_core.o

          mips64r5900el-ps2-elf-nm \
            -u decoder_test/xvid_core.o \
            > decoder_test/remaining.txt

          mips64r5900el-ps2-elf-nm \
            decoder_test/xvid_core.o \
            > decoder_test/symbols.txt

          cat decoder_test/remaining.txt

          wc -l decoder_test/remaining.txt

      - name: Export decoder sources
        if: always()
        run: |
          mkdir -p decoder_test/source
          cp -r include decoder_test/source/
          cp -r src decoder_test/source/
          cp -r opl_native decoder_test/source/

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: V017D-XVID-ISOLATED
          path: decoder_test/
