name: V017 XVID Decoder Probe

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/decoder-v017.yml'

jobs:
  decoder:
    runs-on: ubuntu-latest
    container: ps2dev/ps2dev:latest

    steps:
      - uses: actions/checkout@v4

      - name: Prepare isolated sources
        run: |
          mkdir -p decoder_test

          cat > decoder_test/ctype_compat.h <<'EOF'
          #ifndef DG_CTYPE_COMPAT_H
          #define DG_CTYPE_COMPAT_H
          #include <ctype.h>
          #undef isalnum
          #undef isalpha
          #undef isblank
          #undef iscntrl
          #undef isdigit
          #undef isgraph
          #undef islower
          #undef isprint
          #undef ispunct
          #undef isspace
          #undef isupper
          #undef isxdigit
          #undef toupper
          #undef tolower
          #undef _U
          #endif
          EOF

          sed \
            -e '/#include "SMS_MSMPEG4.h"/d' \
            -e '/#include "SMS_MPEG12.h"/d' \
            -e '/#include "SMS_MP123.h"/d' \
            -e '/#include "SMS_AC3.h"/d' \
            -e '/#include "SMS_DTS.h"/d' \
            -e '/#include "SMS_OGG.h"/d' \
            -e '/#include "SMS_WMA.h"/d' \
            -e '/#include "SMS_PCM.h"/d' \
            -e '/#include "SMS_AAC.h"/d' \
            -e '/#include "SMS_FLAC.h"/d' \
            -e '/^int SMS_CodecOpen (/,/^}  \/\* end SMS_CodecOpen \*\//c\
          int SMS_CodecOpen ( SMS_CodecContext* apCtx ) {\
            if (apCtx->m_ID != SMS_CodecID_MPEG4) return 0;\
            SMS_Codec_MPEG4_Open(apCtx);\
            return apCtx->m_pCodec != 0;\
          }' src/SMS_Codec.c > decoder_test/SMS_Codec_XVID.c

          sed \
            -e 's/fio_dirent_t/io_dirent_t/g' \
            -e '/^void SMS_EEScanDir (/,/^}  \/\* end SMS_EEScanDir \*\//d' \
            src/SMS_EE.c > decoder_test/SMS_EE_XVID.c

      - name: Compile XVID decoder
        run: |
          FAILED=0
          touch decoder_test/build.log
          touch decoder_test/status.txt

          for module in \
            SMS_MPEG4.c \
            SMS_MPEG.c \
            SMS_H263.c \
            SMS_VLC.c \
            SMS_DSP.c \
            SMS_DSP_MMI.S \
            SMS_DSP_QPel.S \
            SMS_VideoBuffer.c \
            SMS_RingBuffer.c \
            SMS_IPU.c \
            SMS_IPU_0.s \
            SMS_IPU_1.c \
            SMS_DMA_0.s \
            SMS_DXSB.c \
            SMS_Data.c \
            SMS_MPEGInit.c \
            SMS_VSync.c \
            SMS_Utils.S \
            SMS_Timer.s \
            SMS_GS_0.S \
            SMS_EE.c \
            SMS_Codec.c
          do
            SOURCE="src/$module"
            EXTRA=""

            case "$module" in
              *.c)
                EXTRA="-include decoder_test/ctype_compat.h"
                ;;
            esac

            case "$module" in
              SMS_Codec.c)
                SOURCE=decoder_test/SMS_Codec_XVID.c
                ;;
              SMS_EE.c)
                SOURCE=decoder_test/SMS_EE_XVID.c
                EXTRA="-include decoder_test/ctype_compat.h -DNEWLIB_PORT_AWARE"
                ;;
            esac

            echo "COMPILANDO $module" >> decoder_test/build.log

            if mips64r5900el-ps2-elf-gcc \
              -D_EE -O2 -G0 \
              -fno-common \
              -ffunction-sections \
              -fdata-sections \
              $EXTRA \
              -Iinclude \
              -Isrc \
              -I"$PS2SDK/ee/include" \
              -I"$PS2SDK/common/include" \
              -I"$PS2SDK/ports/include" \
              -c "$SOURCE" \
              -o "decoder_test/${module%.*}.o" \
              >> decoder_test/build.log 2>&1
            then
              echo "OK $module" >> decoder_test/status.txt
            else
              echo "FALHA $module" >> decoder_test/status.txt
              FAILED=1
            fi
          done

          cat decoder_test/build.log
          cat decoder_test/status.txt
          exit "$FAILED"

      - name: Map individual decoder dependencies
        if: success()
        run: |
          mkdir -p decoder_test/diagnostics

          for obj in decoder_test/*.o
          do
            NAME=$(basename "$obj" .o)

            mips64r5900el-ps2-elf-nm -u "$obj" \
              > "decoder_test/diagnostics/${NAME}_undefined.txt"

            mips64r5900el-ps2-elf-objdump -h -t -r "$obj" \
              > "decoder_test/diagnostics/${NAME}_sections.txt"
          done

          mips64r5900el-ps2-elf-objdump -dr \
            decoder_test/SMS_EE.o \
            > decoder_test/diagnostics/EE_disassembly.txt

      - name: Link XVID core
        if: success()
        run: |
          mips64r5900el-ps2-elf-ld \
            -r \
            --gc-sections \
            --print-gc-sections \
            -u SMS_Codec_MPEG4_Open \
            -Map=decoder_test/link_map.txt \
            decoder_test/*.o \
            -o decoder_test/xvid_core.o \
            > decoder_test/link.log 2>&1

          mips64r5900el-ps2-elf-nm \
            -u decoder_test/xvid_core.o \
            > decoder_test/remaining.txt

          mips64r5900el-ps2-elf-nm \
            decoder_test/xvid_core.o \
            > decoder_test/symbols.txt

          mips64r5900el-ps2-elf-objdump \
            -h -t -r decoder_test/xvid_core.o \
            > decoder_test/core_sections.txt

          cat decoder_test/remaining.txt
          wc -l decoder_test/remaining.txt

      - name: Export source snapshot
        if: always()
        run: |
          mkdir -p decoder_test/source
          cp -r src decoder_test/source/
          cp -r include decoder_test/source/
          cp -r opl_native decoder_test/source/

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: V017I-XVID-DEPENDENCIES
          path: decoder_test/
