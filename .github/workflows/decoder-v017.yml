name: V017 XVID Decoder Probe

on: [workflow_dispatch, push]

jobs:
  decoder:
    runs-on: ubuntu-latest
    container: ps2dev/ps2dev:latest

    steps:
      - uses: actions/checkout@v4

      - name: Compile decoder extended
        run: |
          mkdir -p decoder_test
          FAILED=0

          for module in \
            SMS_MPEG4.c \
            SMS_MPEG.c \
            SMS_H263.c \
            SMS_VLC.c \
            SMS_DSP.c \
            SMS_DSP_MMI.S \
            SMS_DSP_QPel.S \
            SMS_VideoBuffer.c \
            SMS_RingBuffer.c \
            SMS_Codec.c \
            SMS_IPU.c \
            SMS_IPU_0.s \
            SMS_IPU_1.c \
            SMS_DMA_0.s \
            SMS_DXSB.c \
            SMS_Data.c
          do
            echo "COMPILANDO $module"

            if mips64r5900el-ps2-elf-gcc \
              -D_EE -O2 -G0 \
              -fno-common \
              -Iinclude \
              -I"$PS2SDK/ee/include" \
              -I"$PS2SDK/common/include" \
              -I"$PS2SDK/ports/include" \
              -c "src/$module" \
              -o "decoder_test/${module%.*}.o"
            then
              echo "OK $module" >> decoder_test/status.txt
            else
              echo "FALHA $module" >> decoder_test/status.txt
              FAILED=1
            fi
          done

          cat decoder_test/status.txt
          exit "$FAILED"

      - name: Decoder dependencies
        if: always()
        run: |
          mips64r5900el-ps2-elf-nm \
            decoder_test/*.o \
            > decoder_test/symbols.txt

          mips64r5900el-ps2-elf-ld \
            -r decoder_test/*.o \
            -o decoder_test/decoder_combined.o \
            && mips64r5900el-ps2-elf-nm \
            -u decoder_test/decoder_combined.o \
            > decoder_test/remaining.txt

      - name: Find remaining decoder sources
        if: always()
        run: |
          {
            for symbol in \
              SMS_MPEGContext_Init \
              SMS_MPEGContext_Destroy \
              SMS_Rescale \
              SMS_EstimateVSync \
              SMS_EEDIntr \
              SMS_SetAlarm \
              PowerOf2 \
              mips_memset \
              GS_Params \
              GS_XYZ \
              g_Config \
              g_GSCtx \
              g_XShift \
              s_Player
            do
              echo "=========================="
              echo "SYMBOL: $symbol"
              grep -R -n -w "$symbol" src include || true
            done
          } > decoder_test/source_map.txt

          find src include -type f \
            > decoder_test/source_files.txt

          cat decoder_test/source_map.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: V017C-DECODER-MAPPING
          path: decoder_test/
