name: V017K1 Native XVID Integration

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/decoder-v017.yml'

jobs:
  decoder:
    runs-on: ubuntu-latest
    container: ps2dev/ps2dev:latest

    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: apk add --no-cache make

      - name: Prepare isolated sources
        run: |
          mkdir -p decoder_test

          cat > decoder_test/ctype_compat.h <<'EOF'
          #ifndef DG_CTYPE_COMPAT_H
          #define DG_CTYPE_COMPAT_H
          #include <ctype.h>
          #undef isalnum
          #undef isalpha
          #undef isblank
          #undef iscntrl
          #undef isdigit
          #undef isgraph
          #undef islower
          #undef isprint
          #undef ispunct
          #undef isspace
          #undef isupper
          #undef isxdigit
          #undef toupper
          #undef tolower
          #undef _U
          #endif
          EOF

          sed \
            -e '/#include "SMS_MSMPEG4.h"/d' \
            -e '/#include "SMS_MPEG12.h"/d' \
            -e '/#include "SMS_MP123.h"/d' \
            -e '/#include "SMS_AC3.h"/d' \
            -e '/#include "SMS_DTS.h"/d' \
            -e '/#include "SMS_OGG.h"/d' \
            -e '/#include "SMS_WMA.h"/d' \
            -e '/#include "SMS_PCM.h"/d' \
            -e '/#include "SMS_AAC.h"/d' \
            -e '/#include "SMS_FLAC.h"/d' \
            -e '/^int SMS_CodecOpen (/,/^}  \/\* end SMS_CodecOpen \*\//c\
          int SMS_CodecOpen ( SMS_CodecContext* apCtx ) {\
            if (apCtx->m_ID != SMS_CodecID_MPEG4) return 0;\
            SMS_Codec_MPEG4_Open(apCtx);\
            return apCtx->m_pCodec != 0;\
          }' src/SMS_Codec.c > decoder_test/SMS_Codec_XVID.c

          sed \
            -e 's/fio_dirent_t/io_dirent_t/g' \
            -e '/^void SMS_EEScanDir (/,/^}  \/\* end SMS_EEScanDir \*\//d' \
            src/SMS_EE.c > decoder_test/SMS_EE_XVID.c

      - name: Compile XVID modules
        run: |
          FAILED=0

          touch decoder_test/build.log
          touch decoder_test/status.txt

          for module in \
            SMS_MPEG4.c \
            SMS_MPEG.c \
            SMS_H263.c \
            SMS_VLC.c \
            SMS_DSP.c \
            SMS_DSP_MMI.S \
            SMS_DSP_QPel.S \
            SMS_VideoBuffer.c \
            SMS_RingBuffer.c \
            SMS_IPU.c \
            SMS_IPU_0.s \
            SMS_IPU_1.c \
            SMS_DMA_0.s \
            SMS_DXSB.c \
            SMS_Data.c \
            SMS_MPEGInit.c \
            SMS_VSync.c \
            SMS_Utils.S \
            SMS_Timer.s \
            SMS_GS_0.S \
            SMS_EE.c \
            SMS_Codec.c
          do
            SOURCE="src/$module"
            EXTRA=""

            case "$module" in
              *.c)
                EXTRA="-include decoder_test/ctype_compat.h"
                ;;
            esac

            case "$module" in
              SMS_Codec.c)
                SOURCE=decoder_test/SMS_Codec_XVID.c
                ;;
              SMS_EE.c)
                SOURCE=decoder_test/SMS_EE_XVID.c
                EXTRA="-include decoder_test/ctype_compat.h -DNEWLIB_PORT_AWARE"
                ;;
            esac

            echo "COMPILANDO $module" >> decoder_test/build.log

            if mips64r5900el-ps2-elf-gcc \
              -D_EE -O2 -G0 \
              -fno-common \
              -ffunction-sections \
              -fdata-sections \
              $EXTRA \
              -Iinclude \
              -Isrc \
              -I"$PS2SDK/ee/include" \
              -I"$PS2SDK/common/include" \
              -I"$PS2SDK/ports/include" \
              -c "$SOURCE" \
              -o "decoder_test/${module%.*}.o" \
              >> decoder_test/build.log 2>&1
            then
              echo "OK $module" >> decoder_test/status.txt
            else
              echo "FALHA $module" >> decoder_test/status.txt
              FAILED=1
            fi
          done

          cat decoder_test/build.log
          cat decoder_test/status.txt

          exit "$FAILED"

      - name: Fix SMS timer symbol conflict
        run: |
          for obj in decoder_test/SMS_*.o
          do
            mips64r5900el-ps2-elf-objcopy \
              --redefine-sym g_Timer=DG_SMS_Timer \
              "$obj"
          done

          mips64r5900el-ps2-elf-nm \
            decoder_test/SMS_*.o \
            > decoder_test/timer_fix_symbols.txt

      - name: Prepare native V016 base
        run: |
          mkdir -p native_a native_b

          cp -r opl_native/. native_a/
          cp -r opl_native/. native_b/

          sed -i 's/V0\.1\.6/V0.1.7K1-A/g' native_a/main.c
          sed -i 's/V0\.1\.6/V0.1.7K1-B/g' native_b/main.c

          cp decoder_test/SMS_*.o native_b/

          cat > native_b/Makefile <<'EOF'
          EE_BIN = MOVTEST.ELF
          EE_OBJS = main.o iso.o avi.o SMS_MPEG4.o SMS_MPEG.o SMS_H263.o SMS_VLC.o SMS_DSP.o SMS_DSP_MMI.o SMS_DSP_QPel.o SMS_VideoBuffer.o SMS_RingBuffer.o SMS_IPU.o SMS_IPU_0.o SMS_IPU_1.o SMS_DMA_0.o SMS_DXSB.o SMS_Data.o SMS_MPEGInit.o SMS_VSync.o SMS_Utils.o SMS_Timer.o SMS_GS_0.o SMS_EE.o SMS_Codec.o
          EE_LIBS = -ldebug -lcdvd -lm
          EE_CFLAGS = -O2 -G0
          EE_LDFLAGS += -Wl,--gc-sections -Wl,--undefined=SMS_Codec_MPEG4_Open -Wl,-Map=link_map.txt
          all: $(EE_BIN)
          include $(PS2SDK)/samples/Makefile.pref
          include $(PS2SDK)/samples/Makefile.eeglobal
          EOF

      - name: Build native A and B
        run: |
          mkdir -p output/TESTE_A
          mkdir -p output/TESTE_B
          mkdir -p output/diagnostics

          FAILED=0

          for variant in a b
          do
            DIR="native_$variant"

            rm -f "$DIR/MOVTEST.ELF"
            rm -f "$DIR/main.o"
            rm -f "$DIR/iso.o"
            rm -f "$DIR/avi.o"

            if make -C "$DIR" \
              > "output/diagnostics/build_$variant.txt" 2>&1
            then
              if [ -s "$DIR/MOVTEST.ELF" ]; then

                DEST="output/TESTE_A"

                if [ "$variant" = "b" ]; then
                  DEST="output/TESTE_B"
                fi

                cp "$DIR/MOVTEST.ELF" "$DEST/"
                cp "$DIR/SYSTEM.CNF" "$DEST/"

                mips64r5900el-ps2-elf-nm \
                  "$DIR/MOVTEST.ELF" \
                  > "output/diagnostics/symbols_$variant.txt"

                mips64r5900el-ps2-elf-nm \
                  -u "$DIR/MOVTEST.ELF" \
                  > "output/diagnostics/undefined_$variant.txt"

                echo "TESTE $variant OK"
              else
                FAILED=1
              fi
            else
              echo "TESTE $variant FALHOU"
              FAILED=1
            fi

            cat "output/diagnostics/build_$variant.txt"
          done

          if [ -f output/TESTE_B/MOVTEST.ELF ]; then
            if grep -E ' [Tt] SMS_Codec_MPEG4_Open$' \
              output/diagnostics/symbols_b.txt
            then
              echo "XVID PRESENTE NO ELF B"
            else
              echo "ERRO: XVID AUSENTE NO ELF B"
              FAILED=1
            fi
          fi

          if [ -f native_b/link_map.txt ]; then
            cp native_b/link_map.txt output/diagnostics/
          fi

          ls -l output/TESTE_A/
          ls -l output/TESTE_B/

          exit "$FAILED"

      - name: Export diagnostics
        if: always()
        run: |
          mkdir -p output/diagnostics

          cp decoder_test/*.txt output/diagnostics/ || true
          cp decoder_test/*.log output/diagnostics/ || true

          mkdir -p output/source

          cp -r opl_native output/source/

          if [ -d native_a ]; then
            cp native_a/main.c output/source/main_a.c
          fi

          if [ -d native_b ]; then
            cp native_b/main.c output/source/main_b.c
            cp native_b/Makefile output/source/Makefile_B
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: V017K1-NATIVE-XVID-AB
          path: output/
